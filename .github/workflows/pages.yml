# Checks the app and publishes it with GitHub Pages: https://aleserb.github.io/game-world-painter/
name: Test and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Syntax
        run: for f in js/*.js vendor/*.js tests/*.mjs mcp/*.mjs mcp/lib/*.mjs mcp/scripts/*.mjs mcp/test/*.mjs; do node --check "$f"; done
      - name: Lint
        run: npm install --no-save --no-package-lock --no-audit --no-fund eslint@9 globals && npx eslint .
      - name: MCP server
        run: node --test mcp/test/*.test.mjs
      - name: Smoke test in headless Chrome
        run: node tests/smoke.mjs
      - name: AI agent through the MCP server, in headless Chrome
        run: node tests/agent.mjs

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: The site
        run: |
          mkdir _site
          cp -r index.html style.css js vendor docs examples skills LICENSE _site/
          touch _site/.nojekyll
          # a new version of every script and the styles with every commit: browsers keep files for 10 minutes
          v="${GITHUB_SHA::8}"
          sed -i -E "s#(src|href)=\"((js|vendor)/[^\"?]+|style\.css)\"#\1=\"\2?v=$v\"#g" _site/index.html
          grep -c "?v=$v" _site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
